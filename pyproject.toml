[project]
name = "clippon"
version = "0.1.0"
description = "Run a program in a headless cage session and stream it with Sunshine."
requires-python = ">=3.11"
# The gateway's GameStream pairing speaks AES-128-ECB and RSA, neither of
# which is in the standard library. install-daemon.py pulls in
# python-cryptography from pacman; this keeps a plain pip install honest.
dependencies = ["cryptography>=41"]

[project.scripts]
clippon = "clippon.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clippon"]
